# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor:
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". Set the value to "cat" to disable the pager.
pager:
# The path to a unix socket through which send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    checkout-pr: pr checkout
    clone-repo: '!git clone $1'
    init-repo: 'repo create'
    init-repo-node: |
      !"$HOME/.dotfiles/bin/gh-init-repo-node" "$@"
    init-repo-node-private: |
      !init_repo_node_private() {
        case "$1" in
          ""|-h|--help)
            echo "Usage: gh init-repo-node-private <repo-name> [options]"
            echo ""
            echo "Shortcut for creating a private repo via 'gh init-repo-node'."
            echo "Run 'gh init-repo-node --help' for full options and behavior."
            ;;
          *)
            repo_name=$1
            shift
            "$HOME/.dotfiles/bin/gh-init-repo-node" --repo "$repo_name" --visibility private "$@"
            ;;
        esac
      }; init_repo_node_private "$@"
    init-repo-node-public: |
      !init_repo_node_public() {
        case "$1" in
          ""|-h|--help)
            echo "Usage: gh init-repo-node-public <repo-name> [options]"
            echo ""
            echo "Shortcut for creating a public repo via 'gh init-repo-node'."
            echo "Run 'gh init-repo-node --help' for full options and behavior."
            ;;
          *)
            repo_name=$1
            shift
            "$HOME/.dotfiles/bin/gh-init-repo-node" --repo "$repo_name" --visibility public "$@"
            ;;
        esac
      }; init_repo_node_public "$@"
    init-npm: '!npm init && echo "You may like to run npm-package-sort after this too."'
    outdated: |
        !gh_extensions_outdated() {
          if [ "$1" = "-h" ] || [ "$1" = "--help" ] || [ $# -ne 0 ]; then
            echo "Usage: gh outdated"
            echo "Check for outdated GitHub CLI extensions and the gh CLI tool itself."
            echo ""
            echo "This command performs the following actions:"
            echo "  - Lists all installed gh extensions."
            echo "  - Checks if any installed extensions have updates available."
            echo "  - Offers to upgrade individual extensions if updates are available."
            echo "  - Checks if the gh CLI tool is up to date and offers to upgrade it if not."
            echo ""
            echo "Options:"
            echo "  -h, --help     Show this help message and exit."
            return 0
          fi

          gh extension list

          echo

          echo "Release notes:"
          (gh extension list | awk '{print $3}' | sed 's#^#  https://github.com/#' | sed 's#$#/releases#')

          echo

          echo "Checking for outdated extensions..."
          outdated_extensions=$(gh extension upgrade --all --dry-run)
          outdated_found=false

          while read -r line; do
            if [[ $line == *"would have upgraded from"* ]]; then
              outdated_found=true
              extension_name=$(echo "$line" | awk '{print $1}' | tr -d '[]:')
              current_version=$(echo "$line" | awk '{print $(NF-2)}')
              new_version=$(echo "$line" | awk '{print $NF}')

              echo "  Extension $extension_name is outdated (Current: $current_version, Available: $new_version)"

              # echo "Do you want to upgrade $extension_name? [y/N]"
              # read -r upgrade_extension
              # if [ "$upgrade_extension" = "y" ]; then
              #   gh extension upgrade "$extension_name"
              # fi
            fi
          done <<< "$outdated_extensions"

          if [[ $outdated_found == true ]]; then
            echo "Do you want to upgrade all outdated extensions? [y/N]"
            read -r answer
            if [ "$answer" = "y" ]; then
              gh extension upgrade --all
            fi
          else
            echo "  All extensions are up to date!"
          fi

          echo

          echo "Checking to see if gh is up to date..."
          if brew outdated gh | grep -q 'gh'; then
            echo "gh is outdated. Do you want to upgrade? [y/N]"
            read -r upgrade_gh
            if [ "$upgrade_gh" = "y" ]; then
              brew upgrade gh
            fi
          else
            echo "  gh is up to date!"
          fi
        }; gh_extensions_outdated $@
    notifications: '!$HOME/.dotfiles/bin/gh-notifications $@'
    release-notes: '!$HOME/.dotfiles/bin/gh-release-notes $@'
    changelogs: release-notes
    gist-edit: |
      !gist_edit() {
        if [ "$1" = "-h" ] || [ "$1" = "--help" ]; then
          echo "Usage: gh gist-edit [search-term]"
          echo ""
          echo "Search and interactively edit a gist by keyword, or pick from all gists if no term is given."
          echo ""
          echo "Keys:"
          echo "  Enter     Edit selected gist"
          echo "  Ctrl-O    Open in browser"
          echo "  Ctrl-Y    Copy gist URL"
          echo "  Ctrl-P    Toggle preview"
          echo ""
          echo "See Also:"
          echo "  https://github.com/cli/cli/issues/11738"
          echo "    Bug: gh gist edit selector only fetches ~10 gists, lacks filters/limit options"
          return 0
        fi

        local search="${1:-}"

        # Build the gist list once, as a function
        _gist_source() {
          # Header row (tab-separated so `column` aligns it nicely)
          printf '%b' "ID\tDescription\tFiles\tVisibility\tUpdated\n"

          if [ -n "$search" ]; then
            gh gist list --limit 100 --filter "$search"
          else
            gh gist list --limit 100
          fi
        }

        # Footer (clickable if fzf >= 0.65.0)
        export FZF_ORIG_FOOTER=$'Enter: Edit    Ctrl-O: Open    Ctrl-Y: Copy URL    Ctrl-P: Preview'

        # Build list and launch fzf
        local gist_id=$(
          _gist_source |
          column -ts $'\t' |
          FZF_DEFAULT_COMMAND= \
          fzf \
            --prompt 'Gists> ' \
            --ghost 'Type to filter retrieved gists' \
            --info=inline-right \
            --input-border \
            --header-lines=1 \
            --footer "$FZF_ORIG_FOOTER" \
            --footer-border=line \
            --reverse \
            --delimiter='[[:space:]]{2,}' \
            --nth '1..' \
            --with-nth '1..' \
            --accept-nth 1 \
            --bind 'enter:accept' \
            --preview 'gh gist view {1}' \
            --preview-window 'right,50%,border-left,wrap,hidden' \
            --bind 'ctrl-p:toggle-preview' \
            --bind 'ctrl-o:execute-silent:gh gist view {1} --web' \
            --bind 'ctrl-y:execute-silent(
              URL=https://gist.github.com/{1};
              printf %s "$URL" | pbcopy
            )+transform-footer(echo Copied to clipboard)+bg-transform-footer(
              sleep 1; printf %s "$FZF_ORIG_FOOTER"
            )' \
            --bind 'click-footer:transform:
              [[ $FZF_CLICK_FOOTER_WORD =~ Ctrl|Enter ]] && echo "trigger(${FZF_CLICK_FOOTER_WORD%:*})"
            '
        )

        if [ -n "$gist_id" ]; then
          gh gist edit "$gist_id"
        else
          echo "No gist selected."
          return 1
        fi
      }; gist_edit "$@"
    edit-gist: gist-edit
version: "1"
